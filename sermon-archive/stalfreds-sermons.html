<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Alfred's Sermons Archive</title>
    <meta name="description" content="A searchable archive of St Alfred's Anglican Church sermons — filter by series, preacher, year and topic, then read or listen, with full-text transcript search.">
    <link href="https://dq5pwpg1q8ru0.cloudfront.net/2025/07/14/05/50/41/ba22a2dc-62a1-46e4-8e1d-e186c64a74e7/St_Alfreds_Favicon-64x64px.png" rel="shortcut icon" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic|Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic&amp;display=swap" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="stalfreds.css">
    <script src="stalfreds.js" defer></script>
</head>
<body>

    <a class="skip-link" href="#register">Skip to the sermon index</a>

    <div class="topbar">
        <nav class="topbar__inner" aria-label="Podcast links">
            <a class="topbar__link" href="podcast_feed.xml" target="_blank" rel="noopener">Podcast feed</a>
            <a class="topbar__link" href="https://podba.se/validate/?url=https://dave.burt.id.au/podcast_feed.xml" target="_blank" rel="noopener">Validate feed</a>
        </nav>
    </div>

    <header class="masthead">
        <div class="masthead__inner">
            <div class="masthead__brand">
                <a class="masthead__logo-link" href="#" id="brand-home">
                    <img class="masthead__logo" src="https://dq5pwpg1q8ru0.cloudfront.net/2025/06/11/03/21/50/a7103ade-1605-4c54-94d9-693663b963a2/St_Alfreds_Logo-white.png" alt="St Alfred's Anglican Church" />
                </a>
                <div class="masthead__titles">
                    <h1 class="display masthead__title">St Alfred's Sermons Archive</h1>
                </div>
            </div>

            <form class="search" id="search-form" role="search">
                <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
                <label class="visually-hidden" for="search-input">Search sermons and transcripts</label>
                <input class="search__input" id="search-input" type="search" placeholder="Search sermons and transcripts" autocomplete="off" spellcheck="false">
                <button class="search__clear" id="search-clear" type="button" aria-label="Clear search" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                </button>
            </form>
        </div>
    </header>

    <main class="page">

        <div class="index" id="index-view">
            <aside class="facets" aria-label="Filter sermons">
                <h2 class="visually-hidden">Filter sermons</h2>
                <div id="facets"></div>
            </aside>

            <section class="register" id="register" aria-label="Sermon index">
                <div class="status">
                    <p class="status__count" id="status-count" role="status" aria-live="polite"></p>
                    <div class="chips" id="active-chips"></div>
                    <button class="btn btn--ghost" id="clear-filters" type="button" hidden>Clear all</button>
                </div>
                <div id="register-list"></div>
                <p class="transcript__note" id="search-note" hidden></p>
            </section>
        </div>

        <article class="detail" id="detail-view" aria-label="Sermon" hidden></article>

    </main>

    <footer class="footer">
        <div class="footer__inner">
            <span>St Alfred's Anglican Church · sermon archive</span>
            <a href="podcast_feed.xml">Podcast feed</a>
            <a href="https://stalfreds.org" target="_blank" rel="noopener">stalfreds.org</a>
        </div>
    </footer>

    <noscript>
        <div class="page"><div class="notice"><strong>JavaScript is required</strong>The sermon index loads its data in the browser. Please enable JavaScript to browse the archive.</div></div>
    </noscript>


</body>
</html>
